name: build

# Win / Mac でビルドが通ること、翻訳表がそろっていることを確認する（Phase A: UI_MOCK のみ）
on:
  pull_request:
  workflow_dispatch:

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check translations
        run: python3 tools/check_i18n.py

  build:
    needs: i18n
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBooth-${{ runner.os }}
          path: build/VoiceBooth_artefacts/Release
          retention-days: 7
