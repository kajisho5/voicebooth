<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
